name: CI Frontend
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configurer le Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Installer les dependances
        run: npm ci

      - name: Assurance de qualiter avec ESLint
        run: npm run lint

      - name: Lancer les tests avec jest
        run: npm run test

      - name: Construire un build
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: Bixi Chouette Frontend
          path: dist/